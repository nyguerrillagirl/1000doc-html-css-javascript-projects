<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Example</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 10px;
        }
        .grid div {
            background-color: lightblue;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div>Left</div>
        <div>Main</div>
        <div>Right</div>
    </div>
</body>
</html>
