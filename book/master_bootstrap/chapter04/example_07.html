<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 07</title>
    <!-- Bootstrap v5.3.8 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Column Nesting, Offsetting, and Ordering -->
<div class="row"> 
    <div class="col-8 bg-light"> 
        Main Content 
        <div class="row"> 
            <div class="col-6 bg-info">Nested 1</div> 
            <div class="col-6 bg-warning">Nested 2</div> 
        </div> 
    </div> 
    <div class="col-4 bg-secondary text-white">Sidebar</div> 
</div>
<div class="row">
    <div class="col-4 offset-4 bg-success text-white">
        Centered column using offset
    </div>
</div>
<div class="row">
    <div class="col order-3 bg-warning">
        First in HTML, third visually
    </div>
    <div class="col order-1 bg-info">
        Second in HTML, first visually
    </div>
    <div class="col order-2 bg-light">
        Third in HTML, second visually
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
